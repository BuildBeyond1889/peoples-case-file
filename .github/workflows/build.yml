name: Collect records, archive, deploy site
on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ['collector/probe.py', '.github/workflows/probe.yml']
permissions:
  contents: write   # create archive releases
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide full collect vs site-only deploy
        id: mode
        run: |
          MODE=full
          if [ "${{ github.event_name }}" = "push" ] && ! git diff --name-only HEAD~1 HEAD | grep -qE '^(collector/|\.github/)'; then MODE=site; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "Mode: $MODE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse the live data (site-only change)
        if: steps.mode.outputs.mode == 'site'
        run: python collector/reuse_live.py
      - name: Run collector
        if: steps.mode.outputs.mode == 'full'
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
        run: python collector/collect.py
      - name: Run report
        if: always()
        run: |
          echo '## Collector report' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat site/data/index.json >> "$GITHUB_STEP_SUMMARY" || echo 'no index.json' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat site/data/summary.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep built data for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: site/data
          retention-days: 30
      - name: Archive raw snapshots to a monthly release (never in git)
        if: always() && steps.mode.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d archive ] || exit 0
          TAG="archive-$(date -u +%Y-%m)"
          FILE="raw-$(date -u +%Y-%m-%d).tar.gz"
          tar -czf "$FILE" archive
          # release assets must be under 2 GiB: split big archives into numbered parts
          if [ "$(stat -c%s "$FILE")" -gt 1900000000 ]; then split -b 1900m -d "$FILE" "$FILE.part"; rm "$FILE"; fi
          sha256sum "$FILE"* > "$FILE.sha256"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Raw archive $TAG" --notes "Unmodified public-record snapshots with SHA-256 manifests. Never edited after upload."
          gh release upload "$TAG" "$FILE"* --clobber
      - uses: actions/configure-pages@v5
      - name: Add national SEC data (built on Lu's PC, sec-data branch)
        run: |
          if git fetch -q --depth=1 origin sec-data 2>/dev/null; then
            mkdir -p site/sec && git archive FETCH_HEAD sec | tar -x -C site --strip-components=0
            echo "SEC data: $(cat site/sec/meta.json)" >> "$GITHUB_STEP_SUMMARY"
          else echo "no sec-data branch yet" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
