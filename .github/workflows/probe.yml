name: Probe sources (diagnostic)
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['collector/probe.py']
permissions:
  contents: write   # pushes probe output to the probe-results branch so it can be read with git
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python collector/probe.py
      - name: Publish probe output to the probe-results branch
        if: always()
        run: |
          [ -d probe-out ] || exit 0
          cp -r probe-out /tmp/probe-out
          git config user.name "probe-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rq --cached . ; rm -rf ./* .github .gitignore 2>/dev/null || true
          cp -r /tmp/probe-out/* .
          git add -A && git commit -qm "Probe output $(date -u +%F' '%T)" && git push -f origin probe-results
